# __NAME__ — created __DATE__ from template "stat-explainer" (kinetic stat chain: one literal graphic per fact, numbers count in, metaphor ending, 20-30 s)
# The format: hook on the viewer's own plan with a "???" gap -> 6-8 facts, each its own graphic (~2-3 s) -> a door
# metaphor -> logo. Theme kinetic_light: flat stage, ink type, every move whips in / out with motion blur.
# Swap in your facts; keep one noun per beat and give it a literal picture (people -> crowd-fill, a place ->
# line-draw, a split -> stat-split, money -> image-rain, interests -> photo-cycle, buying -> float-cards).
version: 1
name: __NAME__
brand: __BRAND__
theme: kinetic_light
notes: "Every number on screen must be real and sourced (no invented stats). Count INTO the true value."
output: {file: __NAME___v1.mp4, aspect: "9:16", fps: 30}
sources:
__SOURCES__
timeline:
  - section: hook                 # the viewer's own checklist with one blank row; frame 0 is the cover (no entrance)
    text: {content: "Here's what your\n**plan** is missing…", style: plain_title, pos: ["50%", "17%"]}
    text_anim: {effect: none, out: 0.22, out_effect: whip_up}
    clips:
      - src: __CLIP1__
        in: 0.0
        dur: 1.6
        layout: {type: iphone, style: full, height: "62%", center_y: "62%"}
        transition: cut

  - section: crowd                # fact 1: who (a crowd floods the frame behind the line)
    text: none
    clips:
      - {color: transparent, dur: 2.2}
    overlays:
      - {motion: crowd-fill, start: 0.1, props: {fill: 0.75, outro: 0}}
      - {text: "Fact one about\n**your audience**", style: {extends: native_pill, size: 84}, pos: center, anim: {in: whip_up, dur: 0.3}}

  - section: place                # fact 2: where (outline draws, dots pop inside); the crowd collapses into a point
    text: {content: "Fact two about\n**where they are**", style: plain_title, pos: ["50%", "22%"]}
    clips:
      - {color: transparent, dur: 2.4, transition: {type: shrink, dur: 0.4}}
    overlays:
      - {motion: line-draw, props: {shape: house, color: "#111114", strokeWidth: 3, size: 0.74, y: 0.56, dots: 40, dotStyle: dot, outro: 0}}
      # a country: props: {svg: mybrand/maps/country.svg, ...}

  - section: split                # fact 3: a share (REPLACE the values)
    text: none
    clips:
      - {color: transparent, dur: 2.6}
    overlays:
      - {motion: stat-split, props: {entry: push, exit: split, outro: 0.3,
                                     items: [{value: 48, label: "Group A"}, {value: 52, label: "Group B"}]}}

  - section: slam                 # fact 4: the big number (REPLACE), giant slam + marker underline
    text: none
    clips:
      - {color: transparent, dur: 2.1}
    overlays:
      - {text: "**54%**", style: stat, pos: ["50%", "45%"], anim: {in: mega, dur: 0.5, out: whip_left, out_dur: 0.22}}
      - {text: "do the thing", style: stat_label, pos: ["50%", "53.5%"], start: 0.4, anim: {in: whip_left, dur: 0.3, out: whip_left, out_dur: 0.22}}

  - section: range                # fact 5: a range that counts into place (REPLACE)
    text: none
    clips:
      - {color: transparent, dur: 2.2}
    overlays:
      - {counter: {text: "{} to {}", values: [[29, 25], [49, 44]], dur: 1.0, delay: 0.25}, style: stat, pos: ["50%", "45%"],
         anim: {in: whip_left, dur: 0.3, out: whip_left, out_dur: 0.22}}
      - {text: "years old", style: stat_label, pos: ["50%", "53.5%"], anim: {in: whip_left, dur: 0.3, out: whip_left, out_dur: 0.22}}

  - section: words                # fact 6: the noun swap (a prop grows out of a point between the words)
    text: none
    clips:
      - {color: transparent, dur: 2.8}
    overlays:
      - {motion: text-swap, props: {phrases: ["Peak", "Peak 💰 earning", "Peak spending years"], y: 0.47}}
      - {motion: image-rain, start: 1.5, dur: 1.3, props: {mode: stream, shape: note, origin: [0.08, 0.9], direction: -55, emit: 0.7, outro: 0}}

  - section: cards                # fact 7: what they buy / do (cards drift around the number)
    text: none
    clips:
      - {color: transparent, dur: 2.6}
    overlays:
      - {motion: float-cards, props: {count: 8}}
      - {counter: {text: "**{}%**", values: [[76, 70]], dur: 0.9, delay: 0.2}, style: stat, pos: ["50%", "46%"], anim: {in: mega, dur: 0.45}}
      - {text: "decide what to buy", style: stat_label, pos: ["50%", "54.5%"], start: 0.35, anim: {in: whip_left, dur: 0.3}}

  - section: door                 # the metaphor: the answer is somewhere else -> the door opens, the camera flies through
    text: none
    clips:
      - {color: transparent, dur: 3.4}
    overlays:
      - {motion: door-reveal, props: {openAt: 1.35, throughAt: 2.55}}
      - {text: "The people you're\nlooking for", style: plain_title, pos: center, start: 0.15, end: 1.4, anim: {in: blur, dur: 0.3, out: whip_up, out_dur: 0.2}}
      - {text: "are in a different room", style: plain_title, pos: center, start: 1.45, end: 2.5, anim: {in: whip_up, dur: 0.3, out: fade, out_dur: 0.15}}

  - section: logo
    text: none
    clips:
      - {color: transparent, dur: 2.2}
    overlays:
      - {motion: logo-reveal, props: {name: "Your App", layout: row}}     # the brand logo.png is passed automatically
audio:
  music: {generate: {mood: teach, bpm: 100}, volume: -6}
  sfx:
    - {sound: reveal, at: 19.45, align: peak, volume: -14}     # door opens (door section start + openAt); re-time after edits
