# __NAME__ — created __DATE__ from template "feature-drop" (new feature announcement: burst -> demo -> stat -> end card)
version: 1
name: __NAME__
brand: __BRAND__
theme: deep_space
output: {file: __NAME___v1.mp4, aspect: "9:16", fps: 30}
sources:
__SOURCES__
defaults:
  layout: iphone
timeline:
  - section: burst
    text: none
    clips:
      - {motion: text-burst, dur: 1.6, props: {text: "It's **here.**"}}
  - section: demo
    text: {content: "Check-in reminders\nfor **every** flight", style: clean_title, pos: ["50%", "15%"], behind: true}
    text_anim: {by: word, effect: rise, stagger: 0.06}
    clips:
      - {src: __CLIP1__, in: 0.0, dur: 5.0, layout: {type: iphone, top: "30%"},
         enter: {rise: 220, dur: 0.8, fade: 0.0, ease: spring_soft, tilt: [18, -12], scale: 0.9}}
  - section: stat
    text: none
    clips:
      - {color: transparent, dur: 2.2}
    overlays:
      - {counter: {from: 0, to: 5, format: int, suffix: " sec", dur: 1.0}, style: counter, pos: center, anim: pop}
      - {text: "to find anything", style: body, pos: ["50%", "60%"], start: 0.3, anim: rise}
  - section: end
    text: none
    clips:
      - {image: __BRAND__/endcard.png, dur: 1.6, layout: fullbleed, zoom: [1.03, 1.0], transition: {type: flash, dur: 0.15}}
audio:
  music: {generate: {bpm: 120, key: D, drop: 1.6}, volume: -6}
